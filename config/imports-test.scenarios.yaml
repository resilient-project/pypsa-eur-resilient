### IMPORTS scenario 110 €/MWh
decentral-islands-imports:
  carrier_networks:
    CO2:
      enable: false
    H2:
      enable: false   
  pcipmi_projects:
    enable: false
    include: 
      - storage_units_electricity
    options:
      delay: 0
  sector:
    imports:
      enable: true
      limit: 333.3 # 10 Mt CO2 in TWh p.a.
      limit_sense: <=
      price:
        H2: 110

